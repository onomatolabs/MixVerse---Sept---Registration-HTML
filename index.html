<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MixVerse: Mixing Secrets Decoded | Live Sound Mixing Masterclass</title>
  <style>
    :root {
      --bg-dark: #0B0E14;
      --card-bg: #151A23;
      --input-bg: #1A202C;
      --accent-cyan: #00E5FF;
      --accent-hover: #33EBFB;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-color: #2A3241;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 720px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .header-bar {
      height: 4px;
      background-color: var(--accent-cyan);
      border-radius: 2px;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      color: var(--accent-cyan);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Event Details Box */
    .event-info-box {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--accent-cyan);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .info-label {
      color: var(--accent-cyan);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
      min-width: 80px;
    }

    .info-value {
      color: var(--text-main);
    }

    .location-link {
      color: var(--accent-cyan);
      text-decoration: underline;
      transition: color 0.2s;
    }

    .location-link:hover {
      color: var(--accent-hover);
    }

    .section-header {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin: 28px 0 18px 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    label .req {
      color: var(--accent-cyan);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #FFFFFF;
      padding: 12px 14px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      padding-top: 6px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
      text-transform: none;
    }

    input[type="radio"], input[type="checkbox"] {
      accent-color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
    }

    .checkbox-container label {
      text-transform: none;
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.4;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--accent-cyan);
      color: #0B0E14;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.2s ease-in-out;
    }

    .submit-btn:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    .submit-btn:disabled {
      background-color: var(--text-sub);
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
  <!-- Razorpay Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<div class="form-card">
  <div class="header-bar"></div>
  <h1 class="brand-title">MixVerse: Mixing Secrets Decoded</h1>
  <p class="brand-subtitle">Live Sound Mixing Masterclass</p>

  <!-- EVENT DETAILS HEADER -->
  <div class="event-info-box">
    <div class="info-row">
      <span class="info-label">Duration:</span>
      <span class="info-value">3 Days Masterclass (Sept 7th to 9th)</span>
    </div>
    <div class="info-row">
      <span class="info-label">Location:</span>
      <span class="info-value">
        <a href="https://share.google/uX2ApJbX1GmsYg7ZU" target="_blank" rel="noopener noreferrer" class="location-link">
          The Sumba, Ahmedabad
        </a>
      </span>
    </div>
    <div class="info-row">
      <span class="info-label">Pass Fee:</span>
      <span class="info-value">₹15,999 + 18% GST (Total: ₹18,878.82)</span>
    </div>
  </div>

  <form id="masterclassForm">
    
    <!-- ATTENDEE INFORMATION -->
    <div class="section-header">Attendee Information</div>
    <div class="grid-2">
      <div class="form-group">
        <label>First Name <span class="req">*</span></label>
        <input type="text" id="attendeeFirstName" required placeholder="First name">
      </div>
      <div class="form-group">
        <label>Last Name <span class="req">*</span></label>
        <input type="text" id="attendeeLastName" required placeholder="Last name">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Email Address <span class="req">*</span></label>
        <input type="email" id="attendeeEmail" required placeholder="attendee@example.com">
      </div>
      <div class="form-group">
        <label>Phone Number (WhatsApp) <span class="req">*</span></label>
        <!-- 10-Digit Restrictions Enforced Here -->
        <input 
          type="tel" 
          id="attendeePhone" 
          required 
          placeholder="10-digit mobile number" 
          pattern="[0-9]{10}" 
          maxlength="10" 
          minlength="10" 
          title="Please enter a valid 10-digit mobile number"
        >
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Company / Rental House <span class="req">*</span></label>
        <input type="text" id="company" required placeholder="e.g. Sound Kraft / Freelance">
      </div>
      <div class="form-group">
        <label>Designation / Role</label>
        <input type="text" id="designation" placeholder="e.g. FOH Engineer / System Tech">
      </div>
    </div>

    <div class="form-group">
      <label>T-Shirt Size Requirement <span class="req">*</span></label>
      <select id="tshirtSize" required>
        <option value="" disabled selected>Select your T-Shirt size...</option>
        <option value="S">Small (S)</option>
        <option value="M">Medium (M)</option>
        <option value="L">Large (L)</option>
        <option value="XL">Extra Large (XL)</option>
        <option value="2XL">Double Extra Large (2XL)</option>
        <option value="3XL">Triple Extra Large (3XL)</option>
      </select>
    </div>

    <!-- TECHNICAL QUESTIONNAIRE -->
    <div class="section-header">Technical Profile & Workshop Customization</div>

    <div class="grid-2">
      <div class="form-group">
        <label>Live Sound Experience Level <span class="req">*</span></label>
        <select id="experienceLevel" required>
          <option value="" disabled selected>Select experience...</option>
          <option value="Beginner / Audio Student">Beginner / Audio Student</option>
          <option value="Intermediate (Club/Regional Tech)">Intermediate (Club / Regional Tech)</option>
          <option value="Advanced (Touring FOH/Monitor Tech)">Advanced (Touring FOH / Monitor Tech)</option>
        </select>
      </div>
      <div class="form-group">
        <label>FOH, Monitors, or Both? <span class="req">*</span></label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="discipline" value="FOH" required> FOH</label>
          <label class="radio-label"><input type="radio" name="discipline" value="Monitors"> Monitors</label>
          <label class="radio-label"><input type="radio" name="discipline" value="Both"> Both</label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>How did you hear about this workshop?</label>
      <input type="text" id="source" placeholder="Social Media, Word of Mouth, Peer Recommendation">
    </div>

    <div class="form-group">
      <label>What motivated you to enroll?</label>
      <input type="text" id="motivation" placeholder="Key learning objectives or skills you wish to master">
    </div>

    <div class="form-group">
      <label>Favorite Mixing Console & Ecosystem</label>
      <input type="text" id="favoriteConsole" placeholder="e.g. DiGiCo SD/Quantum, Yamaha RIVAGE, Avid S6L, Allen & Heath dLive">
    </div>

    <div class="form-group">
      <label>Topics / Subjects You Want Covered</label>
      <textarea id="requestedTopics" placeholder="Gain staging, phase alignment, sidechaining, KLANG immersive IEMs, room tuning..."></textarea>
    </div>

    <div class="form-group">
      <label>Console or Gear You Wish to See Featured</label>
      <input type="text" id="featuredGear" placeholder="e.g. Waves SoundGrid DSP, Lake Processing, KLANG:konductor">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Favorite Artist / Production Reference</label>
        <input type="text" id="favoriteArtist" placeholder="Bollywood or International touring reference">
      </div>
      <div class="form-group">
        <label>Current Artist or Rental Company Roster</label>
        <input type="text" id="currentRoster" placeholder="Bands, artists, or audio vendors you currently work with">
      </div>
    </div>

    <!-- BILLING ADDRESS -->
    <div class="section-header">Billing Address</div>
    <div class="form-group">
      <label>Full Name / Company Name (for Invoice) <span class="req">*</span></label>
      <input type="text" id="billingName" required placeholder="Name as required on tax invoice">
    </div>
    <div class="form-group">
      <label>Address Line 1 <span class="req">*</span></label>
      <input type="text" id="billingAddress1" required placeholder="Street address, P.O. box">
    </div>
    <div class="form-group">
      <label>Address Line 2</label>
      <input type="text" id="billingAddress2" placeholder="Apartment, suite, unit, building, floor">
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>City <span class="req">*</span></label>
        <input type="text" id="billingCity" required placeholder="City">
      </div>
      <div class="form-group">
        <label>State <span class="req">*</span></label>
        <input type="text" id="billingState" required placeholder="State">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Zip Code <span class="req">*</span></label>
        <input type="text" id="billingZip" required placeholder="Zip / Postal Code">
      </div>
      <div class="form-group">
        <label>Country <span class="req">*</span></label>
        <input type="text" id="billingCountry" required value="India">
      </div>
    </div>

    <div class="checkbox-container">
      <input type="checkbox" id="dataConsent" required>
      <label for="dataConsent">I consent to the processing of my submitted data for event registration, seat allocation, and workshop communications. <span class="req">*</span></label>
    </div>

    <button type="button" id="submitBtn" class="submit-btn" onclick="executeRegistration()">Proceed to Checkout</button>
  </form>
</div>

<script>
  // CONFIGURATION CONSTANTS
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAMfry9O3cVXfJ9nPMBkxPGO_NTrRlZWrUzEh3zwkoufrQ8c-FFApARm3wjnUDJHNzXA/exec";
  const RAZORPAY_KEY_ID   = "rzp_live_TR6K8tulLkAITw"; // Replace with rzp_live_... for production or rzp_test_... for testing

  // PRICING MODE CONFIGURATION
  // Set IS_TEST_MODE = true for a ₹100 test transaction.
  // Set IS_TEST_MODE = false for production (₹15,999 + 18% GST = ₹18,878.82).
  const IS_TEST_MODE = false; 

  const PAYMENT_AMOUNT_PAISE = IS_TEST_MODE ? "10000" : "1000"; // 10000 paise = ₹100 | 1887882 paise = ₹18,878.82

  function executeRegistration() {
    const form = document.getElementById('masterclassForm');
    const submitBtn = document.getElementById('submitBtn');
    const phoneInput = document.getElementById('attendeePhone').value.trim();

    // 1. Native HTML5 Validation
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    // 2. Strict 10-Digit Mobile Number Validation (Regex Guard)
    const phoneRegex = /^[0-9]{10}$/;
    if (!phoneRegex.test(phoneInput)) {
      alert("Please enter a valid 10-digit mobile number (numbers only, without spaces or +91).");
      document.getElementById('attendeePhone').focus();
      return;
    }

    const attendeeFirstName = document.getElementById('attendeeFirstName').value;
    const attendeeLastName  = document.getElementById('attendeeLastName').value;
    const attendeeEmail     = document.getElementById('attendeeEmail').value;
    const discipline        = document.querySelector('input[name="discipline"]:checked')?.value || "FOH";

    // 3. Razorpay Checkout Configuration
    const options = {
      "key": RAZORPAY_KEY_ID,
      "amount": PAYMENT_AMOUNT_PAISE,
      "currency": "INR",
      "name": "MixVerse",
      "description": "Live Sound Mixing Masterclass (Sept 7-9)",
      "handler": function (response) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Logging Data...";

        // Payload sent to Google Sheets upon successful payment capture
        const payload = {
          timestamp: new Date().toISOString(),
          payment_id: response.razorpay_payment_id,
          attendee_first_name: attendeeFirstName,
          attendee_last_name: attendeeLastName,
          attendee_email: attendeeEmail,
          attendee_phone: phoneInput,
          company: document.getElementById('company').value,
          designation: document.getElementById('designation').value,
          tshirt_size: document.getElementById('tshirtSize').value,
          experience_level: document.getElementById('experienceLevel').value,
          discipline: discipline,
          source: document.getElementById('source').value,
          motivation: document.getElementById('motivation').value,
          favorite_console: document.getElementById('favoriteConsole').value,
          requested_topics: document.getElementById('requestedTopics').value,
          featured_gear: document.getElementById('featuredGear').value,
          favorite_artist: document.getElementById('favoriteArtist').value,
          current_roster: document.getElementById('currentRoster').value,
          billing_name: document.getElementById('billingName').value,
          billing_address_1: document.getElementById('billingAddress1').value,
          billing_address_2: document.getElementById('billingAddress2').value,
          billing_city: document.getElementById('billingCity').value,
          billing_state: document.getElementById('billingState').value,
          billing_zip: document.getElementById('billingZip').value,
          billing_country: document.getElementById('billingCountry').value,
          amount_paid: parseInt(PAYMENT_AMOUNT_PAISE) / 100,
          status: "Captured"
        };

        // Post data to Google Apps Script Web App
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
        .then(() => {
          alert("Registration Successful!\n\nPayment ID: " + response.razorpay_payment_id + "\nYour seat for MixVerse Masterclass in Ahmedabad is confirmed.");
          form.reset();
        })
        .catch(err => {
          console.error("Data Logging Error:", err);
          alert("Payment verified successfully, but logging failed. Please save your Payment ID: " + response.razorpay_payment_id);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "Proceed to Checkout";
        });
      },
      "prefill": {
        "name": attendeeFirstName + " " + attendeeLastName,
        "email": attendeeEmail,
        "contact": phoneInput
      },
      "theme": {
        "color": "#00E5FF"
      }
    };

    const rzp = new Razorpay(options);
    rzp.open();
  }
</script>

</body>
</html>
