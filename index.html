<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MixVerse | MIXING SECRETS DECODED</title>
  <style>
    :root {
      --bg-dark: #0B0E14;
      --card-bg: #151A23;
      --input-bg: #1A202C;
      --accent-cyan: #00E5FF;
      --accent-hover: #33EBFB;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-color: #2A3241;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 720px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .header-bar {
      height: 4px;
      background-color: var(--accent-cyan);
      border-radius: 2px;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .section-header {
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin: 28px 0 18px 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    label .req {
      color: var(--accent-cyan);
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #FFFFFF;
      padding: 12px 14px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      padding-top: 6px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-main);
      cursor: pointer;
      text-transform: none;
    }

    input[type="radio"], input[type="checkbox"] {
      accent-color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 20px;
    }

    .checkbox-container label {
      text-transform: none;
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.4;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--accent-cyan);
      color: #0B0E14;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.2s ease-in-out;
    }

    .submit-btn:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<div class="form-card">
  <div class="header-bar"></div>
  <h1 class="brand-title">MixVerse</h1>
  <p class="brand-subtitle">Mixing Secrets Decoded — Live Sound Mixing Masterclass Registration</p>

  <form id="masterclassForm">
    
    <!-- PURCHASER INFORMATION -->
    <div class="section-header">Purchaser Information</div>
    <div class="grid-2">
      <div class="form-group">
        <label>First Name <span class="req">*</span></label>
        <input type="text" id="purchaserFirstName" required placeholder="First name">
      </div>
      <div class="form-group">
        <label>Last Name <span class="req">*</span></label>
        <input type="text" id="purchaserLastName" required placeholder="Last name">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Email <span class="req">*</span></label>
        <input type="email" id="purchaserEmail" required placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Phone <span class="req">*</span></label>
        <input type="tel" id="purchaserPhone" required placeholder="+91 9876543210">
      </div>
    </div>

    <!-- ATTENDEE INFORMATION -->
    <div class="section-header">Attendee Qualification & Gear Profile</div>
    <div class="grid-2">
      <div class="form-group">
        <label>Attendee First Name <span class="req">*</span></label>
        <input type="text" id="attendeeFirstName" required placeholder="First name">
      </div>
      <div class="form-group">
        <label>Attendee Last Name <span class="req">*</span></label>
        <input type="text" id="attendeeLastName" required placeholder="Last name">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Attendee Email <span class="req">*</span></label>
        <input type="email" id="attendeeEmail" required placeholder="attendee@example.com">
      </div>
      <div class="form-group">
        <label>Attendee Phone <span class="req">*</span></label>
        <input type="tel" id="attendeePhone" required placeholder="+91 9876543210">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Company / Rental House</label>
        <input type="text" id="company" placeholder="e.g. Sound Kraft / Freelance">
      </div>
      <div class="form-group">
        <label>Designation / Role</label>
        <input type="text" id="designation" placeholder="e.g. FOH Engineer / System Tech">
      </div>
    </div>

    <!-- TECHNICAL QUESTIONNAIRE -->
    <div class="form-group">
      <label>How did you hear about this workshop?</label>
      <input type="text" id="source" placeholder="Social Media, Word of Mouth, Peer Recommendation">
    </div>

    <div class="form-group">
      <label>What motivated you to enroll?</label>
      <input type="text" id="motivation" placeholder="Key learning objectives or skills you wish to master">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Live Sound Experience Level <span class="req">*</span></label>
        <select id="experienceLevel" required>
          <option value="" disabled selected>Select experience...</option>
          <option value="Beginner / Audio Student">Beginner / Audio Student</option>
          <option value="Intermediate (Club/Regional Tech)">Intermediate (Club / Regional Tech)</option>
          <option value="Advanced (Touring FOH/Monitor Tech)">Advanced (Touring FOH / Monitor Tech)</option>
        </select>
      </div>
      <div class="form-group">
        <label>FOH, Monitors, or Both? <span class="req">*</span></label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="discipline" value="FOH" required> FOH</label>
          <label class="radio-label"><input type="radio" name="discipline" value="Monitors"> Monitors</label>
          <label class="radio-label"><input type="radio" name="discipline" value="Both"> Both</label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Favorite Mixing Console & Ecosystem</label>
      <input type="text" id="favoriteConsole" placeholder="e.g. DiGiCo SD/Quantum, Yamaha RIVAGE, Avid S6L, Allen & Heath dLive">
    </div>

    <div class="form-group">
      <label>Topics / Subjects You Want Covered</label>
      <textarea id="requestedTopics" placeholder="Gain staging, phase alignment, sidechaining, KLANG immersive IEMs, room tuning..."></textarea>
    </div>

    <div class="form-group">
      <label>Console or Gear You Wish to See Featured</label>
      <input type="text" id="featuredGear" placeholder="e.g. Waves SoundGrid DSP, Lake Processing, KLANG:konductor">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Favorite Artist / Production Reference</label>
        <input type="text" id="favoriteArtist" placeholder="Bollywood or International touring reference">
      </div>
      <div class="form-group">
        <label>Current Artist or Rental Company Roster</label>
        <input type="text" id="currentRoster" placeholder="Bands, artists, or audio vendors you currently work with">
      </div>
    </div>

    <!-- BILLING ADDRESS -->
    <div class="section-header">Billing Address</div>
    <div class="form-group">
      <label>Address Line 1</label>
      <input type="text" id="billingAddress1" placeholder="Street address">
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>City</label>
        <input type="text" id="billingCity" placeholder="City">
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" id="billingState" placeholder="State">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>Zip Code</label>
        <input type="text" id="billingZip" placeholder="Zip / Postal Code">
      </div>
      <div class="form-group">
        <label>Country</label>
        <input type="text" id="billingCountry" value="India">
      </div>
    </div>

    <div class="checkbox-container">
      <input type="checkbox" id="dataConsent" required>
      <label for="dataConsent">I consent to the processing of my submitted data for event registration, seat allocation, and workshop communications. <span class="req">*</span></label>
    </div>

    <button type="button" class="submit-btn" onclick="executeRegistration()">Pay & Reserve Seat</button>
  </form>
</div>

<script>
  // CONFIGURATION CONSTANTS
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-0FxeDwz2n6RKIKPRLobawfAb1XUEd4vjcGQcUIOpzsgZYq0P1b6crzU11DBM_71SmQ/exec";
  const RAZORPAY_KEY_ID   = "Yrzp_live_XXyq3q864CLfdB"; // e.g. rzp_live_xxxxxxxxxxxx

  function executeRegistration() {
    const form = document.getElementById('masterclassForm');
    
    // Trigger standard browser validation checks
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    // Extract values
    const purchaserFirstName = document.getElementById('purchaserFirstName').value;
    const purchaserLastName  = document.getElementById('purchaserLastName').value;
    const purchaserEmail     = document.getElementById('purchaserEmail').value;
    const purchaserPhone     = document.getElementById('purchaserPhone').value;

    const attendeeFirstName  = document.getElementById('attendeeFirstName').value;
    const attendeeLastName   = document.getElementById('attendeeLastName').value;
    const attendeeEmail      = document.getElementById('attendeeEmail').value;
    const attendeePhone      = document.getElementById('attendeePhone').value;

    const discipline = document.querySelector('input[name="discipline"]:checked')?.value || "FOH";

    const options = {
      "key": RAZORPAY_KEY_ID,
      "amount": "2500000", // Amount in paise (₹25,000 INR)
      "currency": "INR",
      "name": "MixVerse",
      "description": "Mixing Secrets Decoded Pass",
      "handler": function (response) {
        // Collect full payload for backend logging
        const payload = {
          payment_id: response.razorpay_payment_id,
          purchaser_first_name: purchaserFirstName,
          purchaser_last_name: purchaserLastName,
          purchaser_email: purchaserEmail,
          purchaser_phone: purchaserPhone,
          attendee_first_name: attendeeFirstName,
          attendee_last_name: attendeeLastName,
          attendee_email: attendeeEmail,
          attendee_phone: attendeePhone,
          company: document.getElementById('company').value,
          designation: document.getElementById('designation').value,
          source: document.getElementById('source').value,
          motivation: document.getElementById('motivation').value,
          experience_level: document.getElementById('experienceLevel').value,
          discipline: discipline,
          favorite_console: document.getElementById('favoriteConsole').value,
          requested_topics: document.getElementById('requestedTopics').value,
          featured_gear: document.getElementById('featuredGear').value,
          favorite_artist: document.getElementById('favoriteArtist').value,
          current_roster: document.getElementById('currentRoster').value,
          billing_address_1: document.getElementById('billingAddress1').value,
          billing_city: document.getElementById('billingCity').value,
          billing_state: document.getElementById('billingState').value,
          billing_zip: document.getElementById('billingZip').value,
          billing_country: document.getElementById('billingCountry').value,
          amount: 2500000,
          status: "Captured"
        };

        // Asynchronous post to Google Apps Script Sheet Webhook
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(() => {
          alert("Registration Successful!\nPayment ID: " + response.razorpay_payment_id + "\n\nWelcome to MixVerse. Your delegate confirmation pass has been logged.");
          form.reset();
        }).catch(err => {
          console.error("Transmission Error:", err);
          alert("Payment verified, but logging failed. Please save your Payment ID: " + response.razorpay_payment_id);
        });
      },
      "prefill": {
        "name": purchaserFirstName + " " + purchaserLastName,
        "email": purchaserEmail,
        "contact": purchaserPhone
      },
      "theme": {
        "color": "#00E5FF"
      }
    };

    const rzp = new Razorpay(options);
    rzp.open();
  }
</script>

</body>
</html>
